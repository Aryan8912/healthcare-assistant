services:
  - type: web
    name: medassist-backend
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: pip install --prefer-binary -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-2.0-flash-lite
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"